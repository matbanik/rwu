name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version matches script
        run: |
          SCRIPT_VER=$(grep -oP 'set "ver=\K[0-9]+\.[0-9]+\.[0-9]+' Reset_WindowsUpdate.cmd)
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$SCRIPT_VER" != "$TAG_VER" ]; then
            echo "::error::Version mismatch! Script says $SCRIPT_VER but tag is v$TAG_VER"
            echo "Run: .\bump.ps1 $TAG_VER"
            exit 1
          fi
          echo "✅ Version verified: $SCRIPT_VER"

      - name: Compute SHA256 checksums
        id: hash
        run: |
          HASH_CMD=$(sha256sum Reset_WindowsUpdate.cmd | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          HASH_PS1=$(sha256sum rwu.ps1 | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          echo "sha256_cmd=$HASH_CMD" >> "$GITHUB_OUTPUT"
          echo "sha256_ps1=$HASH_PS1" >> "$GITHUB_OUTPUT"
          echo "Reset_WindowsUpdate.cmd SHA256: $HASH_CMD"
          echo "rwu.ps1               SHA256: $HASH_PS1"

      - name: Generate release body
        id: body
        run: |
          cat > release_body.md << 'HEADER'
          ## Quick Start

          ```powershell
          irm https://matbanik.info/rwu | iex
          ```

          Or download `Reset_WindowsUpdate.cmd` below → right-click → **Run as administrator**.

          ## Integrity

          HEADER

          echo "| File | SHA256 |" >> release_body.md
          echo "|------|--------|" >> release_body.md
          echo "| \`Reset_WindowsUpdate.cmd\` | \`${{ steps.hash.outputs.sha256_cmd }}\` |" >> release_body.md
          echo "| \`rwu.ps1\` | \`${{ steps.hash.outputs.sha256_ps1 }}\` |" >> release_body.md

          cat >> release_body.md << 'FOOTER'

          Verify after download:
          ```powershell
          (Get-FileHash .\Reset_WindowsUpdate.cmd -Algorithm SHA256).Hash
          ```

          > The `irm | iex` launcher automatically verifies this hash before execution.

          SHA256: $HASH_PLACEHOLDER

          ---
          FOOTER

          # Replace placeholder with actual hash (the launcher regex looks for "SHA256: <64hex>")
          sed -i "s/\$HASH_PLACEHOLDER/${{ steps.hash.outputs.sha256_cmd }}/" release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RWU v${{ steps.version.outputs.version }}"
          body_path: release_body.md
          files: |
            Reset_WindowsUpdate.cmd
            rwu.ps1
          generate_release_notes: true
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Sync launcher to matbanik.info so `irm https://matbanik.info/rwu | iex` stays current.
  # This MUST be in release.yml (not a separate workflow) because GitHub's anti-recursion
  # policy prevents GITHUB_TOKEN-generated events from triggering other workflows.
  sync-launcher:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RWU repo
        uses: actions/checkout@v4

      - name: Verify rwu.ps1 exists
        run: |
          if [ ! -f rwu.ps1 ]; then
            echo "::error::rwu.ps1 not found in repository root"
            exit 1
          fi
          echo "✅ rwu.ps1 found ($(wc -c < rwu.ps1) bytes)"

      - name: Checkout matbanik.info repo
        uses: actions/checkout@v4
        with:
          repository: matbanik/info
          token: ${{ secrets.MATBANIK_DEPLOY_TOKEN }}
          path: matbanik-site
          sparse-checkout: |
            public/rwu
          sparse-checkout-cone-mode: false

      - name: Compare and sync
        id: sync
        run: |
          SOURCE="rwu.ps1"
          TARGET="matbanik-site/public/rwu"

          if [ -f "$TARGET" ] && diff -q "$SOURCE" "$TARGET" > /dev/null 2>&1; then
            echo "✅ Launcher already in sync — no changes needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$(dirname "$TARGET")"
            cp "$SOURCE" "$TARGET"
            echo "📦 Launcher updated in matbanik.info/public/rwu"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to matbanik.info
        if: steps.sync.outputs.changed == 'true'
        working-directory: matbanik-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/rwu
          git commit -m "chore: sync rwu.ps1 launcher from matbanik/rwu@${{ github.ref_name }}"
          git push
          echo "✅ Pushed to matbanik/info"
