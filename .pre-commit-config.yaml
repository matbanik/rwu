# Pre-commit hooks for secret scanning and code quality
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Gitleaks - Secret Detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "\U0001F510 Detect secrets with Gitleaks"
        description: Prevents committing secrets and credentials

  # Additional useful hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
        name: "\U0001F418 Check for large files"
      - id: end-of-file-fixer
        name: "\U0001F4C4 Fix end of file"
      - id: trailing-whitespace
        name: "\U00002702 Trim trailing whitespace"
      - id: detect-private-key
        name: "\U0001F511 Detect private keys"
